<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sign in | Lanay</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="../assets/style.css" />
    </head>
    <body>
        <div class="bgart" aria-hidden="true">
            <span class="ring"></span>
            <img src="../assets/images/logo.png" alt="" />
            <span class="wave"></span>
        </div>

        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <symbol id="nigiri" viewBox="0 0 64 64">
                    <rect x="10" y="30" width="44" height="18" rx="9" fill="#fff" />
                    <path d="M8 32c4-14 44-14 48 0z" fill="#F4A58A" />
                    <path
                        d="M20 26l4 4M32 24l4 4M44 26l4 4"
                        stroke="#fff"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </symbol>
                <symbol id="bowl" viewBox="0 0 64 64">
                    <path d="M8 30h48c0 16-10 24-24 24S8 46 8 30z" fill="#fff" />
                    <path d="M16 30c0-9 8-14 16-14s16 5 16 14z" fill="#F8C98A" />
                </symbol>
                <symbol id="plate" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="24" fill="#fff" />
                    <circle cx="32" cy="32" r="14" fill="#F8E7A6" />
                </symbol>
                <symbol id="cup" viewBox="0 0 64 64">
                    <path d="M16 18h32l-4 34H20z" fill="#fff" />
                    <path d="M18 28h28l-1 8H19z" fill="#CFE3D3" />
                    <path d="M34 6l4 12" stroke="#1B1D1F" stroke-width="3" stroke-linecap="round" />
                </symbol>
            </defs>
        </svg>

        <main class="container position-relative pt-4 pb-5 mb-5">
            <div class="text-center py-4">
                <img class="logo-lg mb-3" src="../assets/images/logo.png" alt="Lanay Restaurant" />
                <h1 class="page-title display-4" id="role-greeting">Hello, Waiter</h1>
                <p class="text-secondary fs-5">Enter your 4-digit PIN.</p>
            </div>

            <div class="pin-box mx-auto text-center">
                <div
                    class="alert alert-danger d-none"
                    id="pin-error"
                    role="alert"
                    aria-live="assertive"
                ></div>
                <div class="d-flex justify-content-center gap-3 mb-4" id="dots">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span
                    ><span class="dot"></span>
                </div>
                <div class="keypad">
                    <button type="button" class="btn key" onclick="press('1')">1</button>
                    <button type="button" class="btn key" onclick="press('2')">2</button>
                    <button type="button" class="btn key" onclick="press('3')">3</button>
                    <button type="button" class="btn key" onclick="press('4')">4</button>
                    <button type="button" class="btn key" onclick="press('5')">5</button>
                    <button type="button" class="btn key" onclick="press('6')">6</button>
                    <button type="button" class="btn key" onclick="press('7')">7</button>
                    <button type="button" class="btn key" onclick="press('8')">8</button>
                    <button type="button" class="btn key" onclick="press('9')">9</button>
                    <span></span>
                    <button type="button" class="btn key" onclick="press('0')">0</button>
                    <button type="button" class="btn key" onclick="press('Del')">Del</button>
                </div>
                <a class="btn btn-outline-dark w-100 mt-4" href="login.html"
                    >Not you? Back to roles</a
                >
            </div>

            <script>
                var roleNames = {
                    waiter: "Waiter",
                    kitchen: "Kitchen",
                    cashier: "Cashier",
                    owner: "Owner"
                };

                var params = new URLSearchParams(window.location.search);
                var roleKey = (params.get("role") || "waiter").toLowerCase();
                var activeRole = roleNames[roleKey];
                if (!activeRole) {
                    window.location.replace("login.html");
                }

                document.getElementById("role-greeting").textContent = "Hello, " + activeRole;
                document.title = "Sign in - " + activeRole + " | Lanay";

                var pin = "";
                var busy = false;
                var lockoutTimer = null;
                var lockoutEndsAt = 0;
                var errorBox = document.getElementById("pin-error");

                function showDots() {
                    var dots = document.querySelectorAll("#dots .dot");
                    for (var i = 0; i < dots.length; i++) {
                        dots[i].className = i < pin.length ? "dot on" : "dot";
                    }
                }

                function setKeypadDisabled(disabled) {
                    var keys = document.querySelectorAll(".key");
                    for (var i = 0; i < keys.length; i++) {
                        keys[i].disabled = disabled;
                    }
                }

                function startLockout(message, seconds) {
                    if (lockoutTimer !== null) {
                        clearTimeout(lockoutTimer);
                    }
                    var duration = Math.max(1, Math.ceil(Number(seconds) || 120));
                    lockoutEndsAt = Date.now() + duration * 1000;
                    errorBox.textContent = "";
                    errorBox.appendChild(document.createTextNode(message + " "));
                    var countdown = document.createElement("span");
                    countdown.setAttribute("aria-live", "off");
                    errorBox.appendChild(countdown);
                    errorBox.classList.remove("d-none");
                    setKeypadDisabled(true);

                    function updateCountdown() {
                        var remaining = Math.max(
                            0,
                            Math.ceil((lockoutEndsAt - Date.now()) / 1000),
                        );
                        if (remaining === 0) {
                            lockoutEndsAt = 0;
                            lockoutTimer = null;
                            setKeypadDisabled(false);
                            errorBox.textContent = "You can try entering your PIN again.";
                            return;
                        }
                        var minutes = Math.floor(remaining / 60);
                        var secondsLeft = String(remaining % 60).padStart(2, "0");
                        countdown.textContent = minutes + ":" + secondsLeft;
                        lockoutTimer = setTimeout(updateCountdown, 1000);
                    }

                    updateCountdown();
                }

                async function submitPin() {
                    busy = true;
                    errorBox.classList.add("d-none");
                    setKeypadDisabled(true);

                    try {
                        var response = await fetch("../api/auth/login.php", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ role: roleKey, pin: pin }),
                        });
                        var result = await response.json();
                        if (!response.ok) {
                            var requestError = new Error(result.error || "Sign-in failed.");
                            requestError.status = response.status;
                            requestError.retryAfter = result.retryAfter;
                            throw requestError;
                        }
                        window.location.href = result.redirect;
                    } catch (error) {
                        pin = "";
                        showDots();
                        if (error.status === 429) {
                            startLockout(error.message, error.retryAfter);
                        } else {
                            errorBox.textContent =
                                error instanceof TypeError
                                    ? "Unable to connect. Check that Apache and MySQL are running."
                                    : error.message;
                            errorBox.classList.remove("d-none");
                        }
                    } finally {
                        busy = false;
                        setKeypadDisabled(lockoutEndsAt > Date.now());
                    }
                }

                function press(key) {
                    if (busy || Date.now() < lockoutEndsAt) {
                        return;
                    }
                    if (key == "Del") {
                        pin = pin.slice(0, -1);
                    } else if (pin.length < 4) {
                        pin = pin + key;
                    }
                    showDots();
                    if (pin.length == 4) {
                        submitPin();
                    }
                }

                document.addEventListener("keydown", function (event) {
                    if (/^[0-9]$/.test(event.key)) {
                        event.preventDefault();
                        press(event.key);
                    } else if (event.key == "Backspace") {
                        event.preventDefault();
                        press("Del");
                    }
                });
            </script>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
