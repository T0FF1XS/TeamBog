<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sign in | Lanay</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="../assets/style.css" />
    </head>
    <body>
        <div class="bgart" aria-hidden="true">
            <span class="ring"></span>
            <img src="../assets/images/logo.png" alt="" />
            <span class="wave"></span>
        </div>

        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <symbol id="nigiri" viewBox="0 0 64 64">
                    <rect x="10" y="30" width="44" height="18" rx="9" fill="#fff" />
                    <path d="M8 32c4-14 44-14 48 0z" fill="#F4A58A" />
                    <path
                        d="M20 26l4 4M32 24l4 4M44 26l4 4"
                        stroke="#fff"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </symbol>
                <symbol id="bowl" viewBox="0 0 64 64">
                    <path d="M8 30h48c0 16-10 24-24 24S8 46 8 30z" fill="#fff" />
                    <path d="M16 30c0-9 8-14 16-14s16 5 16 14z" fill="#F8C98A" />
                </symbol>
                <symbol id="plate" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="24" fill="#fff" />
                    <circle cx="32" cy="32" r="14" fill="#F8E7A6" />
                </symbol>
                <symbol id="cup" viewBox="0 0 64 64">
                    <path d="M16 18h32l-4 34H20z" fill="#fff" />
                    <path d="M18 28h28l-1 8H19z" fill="#CFE3D3" />
                    <path d="M34 6l4 12" stroke="#1B1D1F" stroke-width="3" stroke-linecap="round" />
                </symbol>
            </defs>
        </svg>

        <main class="container position-relative pt-4 pb-5 mb-5">
            <div class="text-center py-4">
                <img class="logo-lg mb-3" src="../assets/images/logo.png" alt="Lanay Restaurant" />
                <h1 class="page-title display-4">Who is using Lanay?</h1>
                <p class="text-secondary fs-5">Tap your role, then enter your PIN.</p>
            </div>

            <div class="row g-4 justify-content-center">
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="role-card role-waiter" href="pin.html?role=waiter">
                        <svg
                            width="40"
                            height="40"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M3 16h18M5 16a7 7 0 0 1 14 0M12 8V5" />
                        </svg>
                        <b>Waiter</b>
                        <span>Tables and orders</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="role-card role-kitchen" href="pin.html?role=kitchen">
                        <svg
                            width="40"
                            height="40"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-6 1-9z"
                            />
                        </svg>
                        <b>Kitchen</b>
                        <span>Tickets and timers</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="role-card role-cashier" href="pin.html?role=cashier">
                        <svg
                            width="40"
                            height="40"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 7v10M9.5 10c0-2 5-2 5 0s-5 2-5 4 5 2 5 0"
                            />
                        </svg>
                        <b>Cashier</b>
                        <span>Bills and payments</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <a class="role-card role-owner" href="pin.html?role=owner">
                        <svg
                            width="40"
                            height="40"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
                        </svg>
                        <b>Owner</b>
                        <span>Menu, stock and reports</span>
                    </a>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
