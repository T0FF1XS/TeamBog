<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay receipt</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
        <style>
            .receipt {
                max-width: 420px;
                margin: 0 auto;
                padding: 26px;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 14px 34px rgba(27, 29, 31, 0.12);
            }
            .receipt-line {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                padding: 8px 0;
            }
            .receipt-divider {
                border-top: 2px dashed #dad8d1;
                margin: 14px 0;
            }
            .receipt-actions {
                display: flex;
                gap: 12px;
                justify-content: center;
                margin-top: 18px;
            }
            .status-message {
                margin: 12px auto;
                max-width: 420px;
                padding: 12px 14px;
                border-radius: 14px;
                background: #fbe5df;
                color: #7a2a10;
            }
            .status-message:empty {
                display: none;
            }
            @media print {
                body,
                .pg {
                    padding: 0;
                    background: #fff;
                }
                .bgart,
                .bar,
                .tabs,
                .receipt-actions,
                .status-message {
                    display: none !important;
                }
                .receipt {
                    box-shadow: none;
                    max-width: none;
                    width: 80mm;
                    margin: 0;
                    padding: 4mm;
                }
            }
        </style>
    </head>
    <body>
        <div class="pg">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span>
            </div>
            <main class="wr">
                <header class="bar">
                    <h1 class="h1">Receipt</h1>
                    <span id="cashier-name" class="chip" style="background: #fff; margin-left: auto"
                        >Cashier</span
                    >
                </header>
                <p id="receipt-feedback" class="status-message" role="status" aria-live="polite"></p>
                <article id="receipt" class="receipt" aria-label="Payment receipt">
                    <div style="text-align: center">
                        <img
                            src="../../assets/images/logo.png"
                            alt="Lanay Restaurant"
                            style="width: 72px; height: 72px; object-fit: contain"
                        />
                        <h2 style="margin: 4px 0">Lanay Restaurant</h2>
                        <p style="margin: 0; color: #5b5f63">Payment receipt</p>
                    </div>
                    <div class="receipt-divider"></div>
                    <div id="receipt-meta"></div>
                    <div class="receipt-divider"></div>
                    <div id="receipt-items"></div>
                    <div class="receipt-divider"></div>
                    <div class="receipt-line"><strong>Total</strong><strong id="receipt-total"></strong></div>
                    <div class="receipt-line"><span>Method</span><span id="receipt-method"></span></div>
                    <div class="receipt-line"><span>Received</span><span id="receipt-received"></span></div>
                    <div class="receipt-line"><span>Change</span><span id="receipt-change"></span></div>
                    <div id="receipt-reference-row" class="receipt-line" hidden>
                        <span>Reference</span><span id="receipt-reference"></span>
                    </div>
                    <div class="receipt-divider"></div>
                    <p style="text-align: center; margin: 0">Thank you for dining with us!</p>
                </article>
                <div class="receipt-actions">
                    <button id="print-receipt" class="btn pri" type="button">Print receipt</button>
                    <a class="btn sec" href="orders.html">Back to orders</a>
                </div>
                <nav class="tabs" aria-label="Cashier navigation">
                    <a class="tab" href="orders.html">Orders</a>
                    <a class="tab" href="billing.html">Billing</a>
                    <a class="tab on" href="receipt.html" aria-current="page">Receipt</a>
                </nav>
            </main>
        </div>
        <script>
            var orderId = Number(new URLSearchParams(window.location.search).get("orderId"));

            function money(value) {
                return "₱" + Number(value).toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                });
            }

            function paymentMethodLabel(method) {
                var labels = { cash: "Cash", gcash: "GCash", card: "Card" };
                return labels[method] || method;
            }

            async function readJson(response, message) {
                var result;
                try {
                    result = await response.json();
                } catch (error) {
                    throw new Error(message);
                }
                if (!response.ok) {
                    throw new Error(result.error || message);
                }
                return result;
            }

            async function loadReceipt() {
                var feedback = document.getElementById("receipt-feedback");
                try {
                    if (!Number.isInteger(orderId) || orderId < 1) {
                        throw new Error("Open a receipt from a paid order.");
                    }
                    var session = await readJson(
                        await fetch("../../api/auth/session.php"),
                        "Could not verify the staff session.",
                    );
                    if (!["cashier", "owner"].includes(session.staff.role)) {
                        throw new Error("Only a cashier or owner can view receipts.");
                    }
                    document.getElementById("cashier-name").textContent = session.staff.name;
                    var payment = await readJson(
                        await fetch("../../api/payments.php?orderId=" + encodeURIComponent(orderId)),
                        "Could not load the receipt.",
                    );
                    if (payment.orderStatus !== "paid") {
                        throw new Error("This order has not been paid.");
                    }
                    document.getElementById("receipt-meta").textContent = "";
                    [
                        ["Order", "#" + String(payment.orderId).padStart(4, "0")],
                        ["Table", "Table " + payment.tableNumber],
                        ["Guests", String(payment.guests)],
                        ["Date", new Date(String(payment.createdAt).replace(" ", "T")).toLocaleString()],
                        ["Cashier", payment.cashier || "Staff account deactivated"],
                    ].forEach(function (entry) {
                        var line = document.createElement("div");
                        line.className = "receipt-line";
                        var label = document.createElement("span");
                        label.textContent = entry[0];
                        var value = document.createElement("span");
                        value.textContent = entry[1];
                        line.appendChild(label);
                        line.appendChild(value);
                        document.getElementById("receipt-meta").appendChild(line);
                    });
                    var itemList = document.getElementById("receipt-items");
                    itemList.textContent = "";
                    payment.items.forEach(function (item) {
                        var line = document.createElement("div");
                        line.className = "receipt-line";
                        var label = document.createElement("span");
                        label.textContent = item.quantity + "× " + item.name;
                        var value = document.createElement("span");
                        value.textContent = money(Number(item.price) * item.quantity);
                        line.appendChild(label);
                        line.appendChild(value);
                        itemList.appendChild(line);
                    });
                    document.getElementById("receipt-total").textContent = money(payment.amount);
                    document.getElementById("receipt-method").textContent =
                        paymentMethodLabel(payment.method);
                    document.getElementById("receipt-received").textContent =
                        money(payment.amountReceived);
                    document.getElementById("receipt-change").textContent = money(payment.change);
                    if (payment.reference) {
                        document.getElementById("receipt-reference").textContent = payment.reference;
                        document.getElementById("receipt-reference-row").hidden = false;
                    }
                } catch (error) {
                    feedback.textContent = error.message;
                }
            }

            document.getElementById("print-receipt").addEventListener("click", function () {
                window.print();
            });
            loadReceipt();
        </script>
    </body>
</html>
