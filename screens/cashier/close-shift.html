<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay close shift</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 960px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Close shift</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Cashier</span
                    ><b>6:42 PM</b>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                    <div class="card" style="flex: 1 1 600px; padding: 18px">
                        <p class="h2">Count the cash</p>
                        <div style="display: flex; flex-direction: column; gap: 12px">
                            <div class="ln">
                                <b style="width: 80px">₱1,000</b>
                                <div class="st">
                                    <button class="sb" aria-label="Fewer">−</button
                                    ><b style="width: 30px; text-align: center">3</b
                                    ><button class="sb" aria-label="More">+</button>
                                </div>
                            </div>
                            <div class="ln">
                                <b style="width: 80px">₱500</b>
                                <div class="st">
                                    <button class="sb" aria-label="Fewer">−</button
                                    ><b style="width: 30px; text-align: center">4</b
                                    ><button class="sb" aria-label="More">+</button>
                                </div>
                            </div>
                            <div class="ln">
                                <b style="width: 80px">₱200</b>
                                <div class="st">
                                    <button class="sb" aria-label="Fewer">−</button
                                    ><b style="width: 30px; text-align: center">5</b
                                    ><button class="sb" aria-label="More">+</button>
                                </div>
                            </div>
                            <div class="ln">
                                <b style="width: 80px">₱100</b>
                                <div class="st">
                                    <button class="sb" aria-label="Fewer">−</button
                                    ><b style="width: 30px; text-align: center">8</b
                                    ><button class="sb" aria-label="More">+</button>
                                </div>
                            </div>
                            <div class="ln">
                                <b style="width: 80px">₱50</b>
                                <div class="st">
                                    <button class="sb" aria-label="Fewer">−</button
                                    ><b style="width: 30px; text-align: center">6</b
                                    ><button class="sb" aria-label="More">+</button>
                                </div>
                            </div>
                            <div class="ln">
                                <b style="width: 80px">₱20</b>
                                <div class="st">
                                    <button class="sb" aria-label="Fewer">−</button
                                    ><b style="width: 30px; text-align: center">7</b
                                    ><button class="sb" aria-label="More">+</button>
                                </div>
                            </div>
                        </div>
                        <label class="lbl" for="c1">Coins total (₱)</label
                        ><input id="c1" class="inp" value="120" />
                    </div>
                    <aside class="card" style="flex: 0 1 380px; min-width: 300px">
                        <p class="h2">Result</p>
                        <div
                            style="
                                display: flex;
                                flex-direction: column;
                                gap: 12px;
                                font-size: 17px;
                            "
                        >
                            <div class="ln"><span>Counted</span><b>₱7,360.00</b></div>
                            <div class="ln"><span>Expected</span><b>₱7,400.00</b></div>
                            <div class="ln" style="font-size: 20px">
                                <b>Difference</b
                                ><span class="chip" style="background: #fbdccf; color: #7a2a10"
                                    >Short ₱40.00</span
                                >
                            </div>
                        </div>
                        <div style="margin-top: 20px">
                            <button
                                class="btn pri"
                                style="
                                    min-height: 48px;
                                    font-size: 15px;
                                    padding: 0 18px;
                                    width: 100%;
                                    min-height: 60px;
                                "
                            >
                                Close shift and print report
                            </button>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </body>
</html>
