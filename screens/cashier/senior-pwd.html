<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay discount</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Senior and PWD discount, Table 6</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Cashier</span
                    ><b>6:42 PM</b>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                    <div class="card" style="flex: 1 1 600px; padding: 18px">
                        <b class="lbl" style="margin-top: 0">Discount type</b>
                        <div class="r" style="flex-wrap: wrap; gap: 8px">
                            <button
                                class="qn"
                                style="background: #1b1d1f; color: #fff; border-color: #1b1d1f"
                            >
                                Senior</button
                            ><button class="qn" style="">PWD</button>
                        </div>
                        <b class="lbl">Who gets it?</b>
                        <div class="r" style="flex-wrap: wrap; gap: 8px">
                            <button class="qn" style="">Diner 1</button
                            ><button
                                class="qn"
                                style="background: #1b1d1f; color: #fff; border-color: #1b1d1f"
                            >
                                Diner 2</button
                            ><button class="qn" style="">Diner 3</button
                            ><button class="qn" style="">Whole table</button>
                        </div>
                        <div
                            style="
                                display: grid;
                                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                                gap: 16px;
                                margin-top: 6px;
                            "
                        >
                            <div>
                                <label class="lbl" for="d1">Name on the ID</label
                                ><input id="d1" class="inp" value="" />
                            </div>
                            <div>
                                <label class="lbl" for="d2">ID number</label
                                ><input id="d2" class="inp" value="" inputmode="numeric" />
                            </div>
                        </div>
                        <div style="margin-top: 16px">
                            <button
                                class="btn sec"
                                style="
                                    min-height: 48px;
                                    font-size: 15px;
                                    padding: 0 18px;
                                    width: 100%;
                                    min-height: 56px;
                                "
                            >
                                Take a photo of the ID
                            </button>
                        </div>
                    </div>
                    <aside class="card" style="flex: 0 1 380px; min-width: 300px">
                        <p class="h2">What happens next</p>
                        <p style="margin: 0; font-size: 15px; line-height: 1.6">
                            The system works out the discount for the diner you pick and shows it on
                            the bill. The name and ID are saved in the discount logbook.
                        </p>
                        <div style="margin-top: 20px">
                            <button
                                class="btn pri"
                                style="
                                    min-height: 48px;
                                    font-size: 15px;
                                    padding: 0 18px;
                                    width: 100%;
                                    min-height: 60px;
                                "
                            >
                                Apply discount
                            </button>
                        </div>
                        <div style="height: 12px"></div>
                        <button
                            class="btn sec"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                width: 100%;
                                min-height: 56px;
                            "
                        >
                            Cancel
                        </button>
                    </aside>
                </div>
            </div>
        </div>
    </body>
</html>
