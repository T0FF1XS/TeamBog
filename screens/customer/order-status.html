<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay order status</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/customer.css" />
    </head>
    <body>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <symbol id="nigiri" viewBox="0 0 64 64">
                    <rect x="10" y="30" width="44" height="18" rx="9" fill="#fff" />
                    <path d="M8 32c4-14 44-14 48 0z" fill="#F4A58A" />
                    <path
                        d="M20 26l4 4M32 24l4 4M44 26l4 4"
                        stroke="#fff"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </symbol>
                <symbol id="maki" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="22" fill="#2B3F40" />
                    <circle cx="32" cy="32" r="16" fill="#fff" />
                    <circle cx="32" cy="32" r="7" fill="#F4A58A" />
                </symbol>
                <symbol id="bowl" viewBox="0 0 64 64">
                    <path d="M8 30h48c0 16-10 24-24 24S8 46 8 30z" fill="#fff" />
                    <path d="M16 30c0-9 8-14 16-14s16 5 16 14z" fill="#F8C98A" />
                </symbol>
            </defs>
        </svg>
        <div class="ph">
            <div class="r" style="margin-bottom: 10px">
                <img class="lg" src="../../assets/images/logo.png" alt="Lanay Restaurant" /><span
                    class="chip"
                    style="background: #fff"
                    >Table 6</span
                >
            </div>
            <p class="script" style="font-size: 50px; margin: 6px 0 2px">Thank you</p>
            <p style="margin: 0 0 16px; color: #5b5f63; font-size: 15px">
                Your order is being prepared.
            </p>
            <div class="card" style="padding: 20px 14px">
                <div style="display: flex; position: relative">
                    <div
                        style="
                            flex: 1;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            gap: 8px;
                            font-size: 12px;
                            font-weight: 500;
                        "
                    >
                        <span
                            style="
                                width: 34px;
                                height: 34px;
                                border-radius: 50%;
                                background: #1b1d1f;
                                color: #fff;
                                display: grid;
                                place-items: center;
                                box-shadow: inset 0 0 0 2px #dad8d1;
                            "
                            ><svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M5 13l4 4L19 7" /></svg></span
                        >Sent
                    </div>
                    <div
                        style="
                            flex: 1;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            gap: 8px;
                            font-size: 12px;
                            font-weight: 500;
                        "
                    >
                        <span
                            style="
                                width: 34px;
                                height: 34px;
                                border-radius: 50%;
                                background: #1b1d1f;
                                color: #fff;
                                display: grid;
                                place-items: center;
                                box-shadow: inset 0 0 0 2px #dad8d1;
                            "
                            ><svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M5 13l4 4L19 7" /></svg></span
                        >Confirmed
                    </div>
                    <div
                        style="
                            flex: 1;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            gap: 8px;
                            font-size: 12px;
                            font-weight: 600;
                        "
                    >
                        <span
                            style="
                                width: 34px;
                                height: 34px;
                                border-radius: 50%;
                                background: #1b1d1f;
                                color: #fff;
                                display: grid;
                                place-items: center;
                                box-shadow: 0 0 0 6px #f4b49c;
                            "
                        ></span
                        >Preparing
                    </div>
                    <div
                        style="
                            flex: 1;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            gap: 8px;
                            font-size: 12px;
                            font-weight: 500;
                        "
                    >
                        <span
                            style="
                                width: 34px;
                                height: 34px;
                                border-radius: 50%;
                                background: #fff;
                                color: #fff;
                                display: grid;
                                place-items: center;
                                box-shadow: inset 0 0 0 2px #dad8d1;
                            "
                        ></span
                        >Served
                    </div>
                </div>
                <div style="text-align: center; margin-top: 18px">
                    <span style="font-size: 14px; color: #5b5f63">Estimated wait</span>
                    <div style="font-size: 34px; font-weight: 600; line-height: 1.2">
                        About 12 min
                    </div>
                </div>
            </div>
            <div
                class="card"
                style="
                    margin-top: 14px;
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                    padding: 16px;
                "
            >
                <div class="r" style="justify-content: space-between; font-size: 15px">
                    <span>2× Salmon nigiri</span
                    ><span
                        class="chip"
                        style="
                            background: #f8e7a6;
                            color: #5a4300;
                            min-height: 28px;
                            font-size: 13px;
                        "
                        >Preparing</span
                    >
                </div>
                <div class="r" style="justify-content: space-between; font-size: 15px">
                    <span>1× California maki</span
                    ><span
                        class="chip"
                        style="
                            background: #f8e7a6;
                            color: #5a4300;
                            min-height: 28px;
                            font-size: 13px;
                        "
                        >Preparing</span
                    >
                </div>
                <div class="r" style="justify-content: space-between; font-size: 15px">
                    <span>1× Chicken katsu curry</span
                    ><span
                        class="chip"
                        style="
                            background: #eceae4;
                            color: #1b1d1f;
                            min-height: 28px;
                            font-size: 13px;
                        "
                        >Confirmed</span
                    >
                </div>
            </div>
            <div
                style="
                    position: absolute;
                    left: 20px;
                    right: 20px;
                    bottom: 20px;
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                "
            >
                <button class="btn pri">Request the bill</button>
                <div class="r" style="gap: 12px">
                    <button class="btn sec">Order more</button
                    ><button class="btn sec">Call waiter</button>
                </div>
            </div>
        </div>
    </body>
</html>
