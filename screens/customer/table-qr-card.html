<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay table QR card</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/customer.css" />

        <div
            style="
                position: relative;
                overflow: hidden;
                width: 600px;
                height: 820px;
                font-family: &quot;Poppins&quot;, sans-serif;
                color: #1b1d1f;
                background:
                    radial-gradient(520px 300px at 0 0, #e6ede4, transparent 60%),
                    radial-gradient(460px 280px at 100% 0, #fce5da, transparent 60%), #f6f5f2;
                padding: 22px;
            "
        >
            <div
                style="
                    height: 100%;
                    border: 2px solid #1b1d1f;
                    border-radius: 40px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: space-between;
                    padding: 34px 40px;
                    text-align: center;
                    background: rgba(255, 255, 255, 0.55);
                "
            >
                <img
                    class="lg"
                    src="../../assets/images/logo.png"
                    alt="Lanay Restaurant"
                    style="width: 130px; height: 130px"
                />
                <div>
                    <p class="script" style="font-size: 78px">Scan to order</p>
                    <p style="margin: 6px 0 0; font-size: 18px; color: #5b5f63">
                        Point your phone camera at the code.
                    </p>
                </div>

                        border-radius: 30px;
