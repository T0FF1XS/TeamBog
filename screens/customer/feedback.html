<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay customer feedback</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/customer.css" />
    </head>
    <body>
        <div class="ph">
            <div class="r" style="margin-bottom: 10px">
                <img class="lg" src="../../assets/images/logo.png" alt="Lanay Restaurant" /><span
                    class="chip"
                    style="background: #fff"
                    >Table 6</span
                >
            </div>
            <p class="script" style="font-size: 50px; margin: 6px 0 2px">Thank you</p>
            <p style="margin: 0 0 18px; color: #5b5f63; font-size: 15px">How was your meal?</p>
            <div class="r" style="justify-content: center; gap: 6px; margin-bottom: 20px">
                <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"
                        fill="#F4B49C"
                        stroke="#1B1D1F"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    /></svg
                ><svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"
                        fill="#F4B49C"
                        stroke="#1B1D1F"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    /></svg
                ><svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"
                        fill="#F4B49C"
                        stroke="#1B1D1F"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    /></svg
                ><svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"
                        fill="#F4B49C"
                        stroke="#1B1D1F"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    /></svg
                ><svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"
                        fill="#fff"
                        stroke="#1B1D1F"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>
            <b style="font-size: 15px">What stood out?</b>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px">
                <button
                    class="qn"
                    style="background: #f8e7a6; border-color: #f8e7a6; font-weight: 600"
                >
                    Food</button
                ><button
                    class="qn"
                    style="background: #f8e7a6; border-color: #f8e7a6; font-weight: 600"
                >
                    Service</button
                ><button class="qn" style="">Wait time</button
                ><button class="qn" style="">Place</button>
            </div>
            <label for="cm" style="position: absolute; left: -9999px">Comment</label
            ><textarea
                id="cm"
                placeholder="Tell us more (optional)"
                style="
                    width: 100%;
                    min-height: 110px;
                    border: 2px solid #dad8d1;
                    border-radius: 16px;
                    padding: 12px 14px;
                    font-family: inherit;
                    font-size: 16px;
                "
            ></textarea>
            <div
                style="
                    position: absolute;
                    left: 20px;
                    right: 20px;
                    bottom: 20px;
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                "
            >
                <button
                    class="btn pri"
                    style="
                        min-height: 48px;
                        font-size: 15px;
                        padding: 0 18px;
                        width: 100%;
                        min-height: 62px;
                        font-size: 18px;
                    "
                >
                    Send feedback</button
                ><button
                    class="btn sec"
                    style="min-height: 48px; font-size: 15px; padding: 0 18px; width: 100%"
                >
                    Skip
                </button>
            </div>
        </div>
    </body>
</html>
