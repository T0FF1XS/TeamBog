<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay customer order</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/customer.css" />
    </head>
    <body>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <symbol id="nigiri" viewBox="0 0 64 64">
                    <rect x="10" y="30" width="44" height="18" rx="9" fill="#fff" />
                    <path d="M8 32c4-14 44-14 48 0z" fill="#F4A58A" />
                    <path
                        d="M20 26l4 4M32 24l4 4M44 26l4 4"
                        stroke="#fff"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </symbol>
                <symbol id="maki" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="22" fill="#2B3F40" />
                    <circle cx="32" cy="32" r="16" fill="#fff" />
                    <circle cx="32" cy="32" r="7" fill="#F4A58A" />
                </symbol>
                <symbol id="bowl" viewBox="0 0 64 64">
                    <path d="M8 30h48c0 16-10 24-24 24S8 46 8 30z" fill="#fff" />
                    <path d="M16 30c0-9 8-14 16-14s16 5 16 14z" fill="#F8C98A" />
                </symbol>
            </defs>
        </svg>
        <div class="ph">
            <div class="r" style="margin-bottom: 14px">
                <button
                    class="sb"
                    aria-label="Back"
                    style="background: #fff; box-shadow: 0 4px 14px rgba(27, 29, 31, 0.12)"
                >
                    <svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M15 5l-7 7 7 7" />
                    </svg>
                </button>
                <p class="script" style="font-size: 44px">Your order</p>
                <span class="chip" style="background: #fff; margin-left: auto">Table 6</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px">
                <div class="row" style="padding: 10px 12px">
                    <div class="art" style="width: 56px; height: 56px; background: #fbdccf">
                        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
                            <use href="#nigiri" />
                        </svg>
                    </div>
                    <div style="flex: 1">
                        <b style="font-weight: 600; font-size: 15px; display: block"
                            >Salmon nigiri</b
                        ><span
                            class="chip"
                            style="
                                background: #f8e7a6;
                                color: #5a4300;
                                min-height: 26px;
                                font-size: 12px;
                                margin-top: 4px;
                            "
                            >No wasabi</span
                        >
                    </div>
                    <div class="r" style="gap: 8px">
                        <button
                            class="sb"
                            style="width: 40px; height: 40px"
                            aria-label="Remove one"
                        >
                            −</button
                        ><b>2</b
                        ><button class="sb" style="width: 40px; height: 40px" aria-label="Add one">
                            +
                        </button>
                    </div>
                </div>
                <div class="row" style="padding: 10px 12px">
                    <div class="art" style="width: 56px; height: 56px; background: #cfe3d3">
                        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
                            <use href="#maki" />
                        </svg>
                    </div>
                    <div style="flex: 1">
                        <b style="font-weight: 600; font-size: 15px; display: block"
                            >California maki</b
                        >
                    </div>
                    <div class="r" style="gap: 8px">
                        <button
                            class="sb"
                            style="width: 40px; height: 40px"
                            aria-label="Remove one"
                        >
                            −</button
                        ><b>1</b
                        ><button class="sb" style="width: 40px; height: 40px" aria-label="Add one">
                            +
                        </button>
                    </div>
                </div>
                <div class="row" style="padding: 10px 12px">
                    <div class="art" style="width: 56px; height: 56px; background: #fbefc0">
                        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
                            <use href="#bowl" />
                        </svg>
                    </div>
                    <div style="flex: 1">
                        <b style="font-weight: 600; font-size: 15px; display: block"
                            >Chicken katsu curry</b
                        >
                    </div>
                    <div class="r" style="gap: 8px">
                        <button
                            class="sb"
                            style="width: 40px; height: 40px"
                            aria-label="Remove one"
                        >
                            −</button
                        ><b>1</b
                        ><button class="sb" style="width: 40px; height: 40px" aria-label="Add one">
                            +
                        </button>
                    </div>
                </div>
            </div>
            <div class="card" style="margin-top: 14px; padding: 16px">
                <div class="r" style="justify-content: space-between; font-size: 16px">
                    <span>Subtotal</span><b>₱630.00</b>
                </div>
                <p style="margin: 8px 0 0; font-size: 13px; color: #5b5f63">
                    Senior and PWD discounts are applied by the cashier when you pay.
                </p>
            </div>
            <div
                class="card"
                style="margin-top: 12px; padding: 14px 16px; background: #fbf1cf; box-shadow: none"
            >
                <span style="font-size: 14px"
                    >A waiter will confirm your order before it goes to the kitchen.</span
                >
            </div>
            <div
                style="
                    position: absolute;
                    left: 20px;
                    right: 20px;
                    bottom: 20px;
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                "
            >
                <button class="btn pri" style="min-height: 62px; font-size: 18px">Send order</button
                ><button class="btn sec">Add more items</button>
            </div>
        </div>
    </body>
</html>
