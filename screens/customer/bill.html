<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay customer bill</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/customer.css" />
    </head>
    <body>
        <div class="ph">
            <div class="r" style="margin-bottom: 10px">
                <img class="lg" src="../../assets/images/logo.png" alt="Lanay Restaurant" /><span
                    class="chip"
                    style="background: #fff"
                    >Table 6</span
                >
            </div>
            <p class="script" style="font-size: 46px; margin: 6px 0 12px">Your bill</p>
            <div class="card" style="display: flex; flex-direction: column; gap: 12px">
                <div class="ln" style="font-size: 15px">
                    <span>2× Salmon nigiri</span><b>₱240.00</b>
                </div>
                <div class="ln" style="font-size: 15px">
                    <span>1× California maki</span><b>₱180.00</b>
                </div>
                <div class="ln" style="font-size: 15px">
                    <span>1× Chicken katsu curry</span><b>₱210.00</b>
                </div>
                <div
                    class="ln"
                    style="border-top: 2px dashed #d8d6cf; padding-top: 12px; font-size: 22px"
                >
                    <b>Total</b><b>₱630.00</b>
                </div>
            </div>
            <b style="display: block; margin: 16px 0 8px; font-size: 15px">How will you pay?</b>
            <div class="r" style="gap: 8px">
                <button
                    class="btn pri"
                    style="min-height: 48px; font-size: 15px; padding: 0 18px; flex: 1; padding: 0"
                >
                    Cash</button
                ><button
                    class="btn sec"
                    style="min-height: 48px; font-size: 15px; padding: 0 18px; flex: 1; padding: 0"
                >
                    GCash</button
                ><button
                    class="btn sec"
                    style="min-height: 48px; font-size: 15px; padding: 0 18px; flex: 1; padding: 0"
                >
                    Card
                </button>
            </div>
            <div
                class="card"
                style="
                    margin-top: 14px;
                    padding: 14px 16px;
                    background: #fbf1cf;
                    box-shadow: none;
                    font-size: 14px;
                "
            >
                Senior and PWD discounts are applied by the cashier. Please have your ID ready.
            </div>
            <div style="position: absolute; left: 20px; right: 20px; bottom: 20px">
                <button
                    class="btn pri"
                    style="
                        min-height: 48px;
                        font-size: 15px;
                        padding: 0 18px;
                        width: 100%;
                        min-height: 62px;
                        font-size: 18px;
                    "
                >
                    Request the bill
                </button>
            </div>
        </div>
    </body>
</html>
