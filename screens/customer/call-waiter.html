<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay call waiter</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/customer.css" />
    </head>
    <body>
        <div class="ph">
            <div class="r" style="margin-bottom: 10px">
                <img class="lg" src="../../assets/images/logo.png" alt="Lanay Restaurant" /><span
                    class="chip"
                    style="background: #fff"
                    >Table 6</span
                >
            </div>
            <p class="script" style="font-size: 46px; margin: 6px 0 4px">Call a waiter</p>
            <p style="margin: 0 0 16px; color: #5b5f63; font-size: 15px">What do you need?</p>
            <div style="display: flex; flex-direction: column; gap: 12px">
                <button
                    class="btn sec"
                    style="
                        min-height: 48px;
                        font-size: 15px;
                        padding: 0 18px;
                        min-height: 64px;
                        width: 100%;
                        font-size: 17px;
                    "
                >
                    Water or refill</button
                ><button
                    class="btn pri"
                    style="
                        min-height: 48px;
                        font-size: 15px;
                        padding: 0 18px;
                        min-height: 64px;
                        width: 100%;
                        font-size: 17px;
                    "
                >
                    Utensils or napkins</button
                ><button
                    class="btn sec"
                    style="
                        min-height: 48px;
                        font-size: 15px;
                        padding: 0 18px;
                        min-height: 64px;
                        width: 100%;
                        font-size: 17px;
                    "
                >
                    I have a question
                </button>
            </div>
            <div
                class="card"
                style="
                    margin-top: 20px;
                    display: flex;
                    align-items: center;
                    gap: 14px;
                    background: #cfe3d3;
                    box-shadow: none;
                "
            >
                <span
                    style="
                        width: 44px;
                        height: 44px;
                        border-radius: 50%;
                        background: #1b1d1f;
                        color: #fff;
                        display: grid;
                        place-items: center;
                    "
                    ><svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M5 13l4 4L19 7" /></svg
                ></span>
                <div>
                    <b>A waiter is on the way</b>
                    <div style="font-size: 13px">Asked for utensils or napkins</div>
                </div>
            </div>
        </div>
    </body>
</html>
