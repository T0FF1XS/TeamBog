<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay take order</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <symbol id="nigiri" viewBox="0 0 64 64">
                    <rect x="10" y="30" width="44" height="18" rx="9" fill="#fff" />
                    <path d="M8 32c4-14 44-14 48 0z" fill="#F4A58A" />
                    <path
                        d="M20 26l4 4M32 24l4 4M44 26l4 4"
                        stroke="#fff"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </symbol>
                <symbol id="maki" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="22" fill="#1B1D1F" />
                    <circle cx="32" cy="32" r="16" fill="#fff" />
                    <circle cx="32" cy="32" r="7" fill="#F4A58A" />
                </symbol>
                <symbol id="bowl" viewBox="0 0 64 64">
                    <path d="M8 30h48c0 16-10 24-24 24S8 46 8 30z" fill="#fff" />
                    <path d="M16 30c0-9 8-14 16-14s16 5 16 14z" fill="#F4B49C" />
                </symbol>
                <symbol id="gyoza" viewBox="0 0 64 64">
                    <path d="M8 42c0-16 14-22 24-22s24 6 24 22z" fill="#fff" />
                    <path
                        d="M16 40l2-9M26 40l1-11M36 40l-1-11M46 40l-2-9"
                        stroke="#F4B49C"
                        stroke-width="3"
                        stroke-linecap="round"
                    />
                </symbol>
                <symbol id="tempura" viewBox="0 0 64 64">
                    <rect
                        x="8"
                        y="22"
                        width="48"
                        height="13"
                        rx="6.5"
                        transform="rotate(-20 32 32)"
                        fill="#F4B49C"
                    />
                    <rect
                        x="12"
                        y="34"
                        width="44"
                        height="13"
                        rx="6.5"
                        transform="rotate(-20 32 32)"
                        fill="#F8E7A6"
                    />
                </symbol>
                <symbol id="cup" viewBox="0 0 64 64">
                    <path d="M16 18h32l-4 34H20z" fill="#fff" />
                    <path d="M18 28h28l-1 8H19z" fill="#CFE3D3" />
                    <path d="M34 6l4 12" stroke="#1B1D1F" stroke-width="3" stroke-linecap="round" />
                </symbol>
            </defs>
        </svg>
        <div class="pg" style="min-height: 940px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <a
                        class="btn sec"
                        href="../waiter/tables.html"
                        style="min-height: 52px; font-size: 16px"
                        >Back to tables</a
                    >
                    <h1 class="h1">Table 6</h1>
                    <div class="st" style="margin-left: auto">
                        <span style="font-size: 16px">Guests</span
                        ><button class="sb" aria-label="Fewer guests">−</button><b>3</b
                        ><button class="sb" aria-label="More guests">+</button>
                    </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                    <div style="flex: 1 1 560px">
                        <div class="r" style="flex-wrap: wrap; margin-bottom: 16px">
                            <button class="btn pri" style="min-height: 52px; font-size: 16px">
                                All</button
                            ><button class="btn sec" style="min-height: 52px; font-size: 16px">
                                Sushi</button
                            ><button class="btn sec" style="min-height: 52px; font-size: 16px">
                                Maki</button
                            ><button class="btn sec" style="min-height: 52px; font-size: 16px">
                                Hot kitchen</button
                            ><button class="btn sec" style="min-height: 52px; font-size: 16px">
                                Drinks
                            </button>
                        </div>
                        <div
                            style="
                                display: grid;
                                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                                gap: 14px;
                            "
                        >
                            <button class="it" style="box-shadow: inset 0 0 0 3px #1b1d1f">
                                <span class="qb">2</span>
                                <div class="art" style="background: #fbdccf">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#nigiri" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">Salmon nigiri</b
                                ><span style="font-size: 16px">₱120</span></button
                            ><button class="it" style="box-shadow: inset 0 0 0 3px #1b1d1f">
                                <span class="qb">1</span>
                                <div class="art" style="background: #cfe3d3">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#maki" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">California maki</b
                                ><span style="font-size: 16px">₱180</span></button
                            ><button class="it" style="box-shadow: inset 0 0 0 3px #1b1d1f">
                                <span class="qb">1</span>
                                <div class="art" style="background: #fbefc0">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#bowl" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">Chicken katsu curry</b
                                ><span style="font-size: 16px">₱210</span></button
                            ><button class="it" style="">
                                <div class="art" style="background: #e8e5de">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#gyoza" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">Gyoza</b
                                ><span style="font-size: 16px">₱95</span></button
                            ><button class="it" style="">
                                <div class="art" style="background: #ffe9b8">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#maki" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">Dragon roll</b
                                ><span style="font-size: 16px">₱260</span></button
                            ><button class="it" style="">
                                <div class="art" style="background: #fbdccf">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#tempura" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">Ebi tempura</b
                                ><span style="font-size: 16px">₱150</span></button
                            ><button class="it" style="">
                                <div class="art" style="background: #cfe3d3">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#bowl" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">Miso soup</b
                                ><span style="font-size: 16px">₱70</span></button
                            ><button
                                class="it"
                                disabled
                                style="
                                    background: #eeece7;
                                    color: #5b5f63;
                                    cursor: default;
                                    box-shadow: none;
                                "
                            >
                                <div class="art" style="background: #e6e4de">
                                    <svg
                                        width="56"
                                        height="56"
                                        viewBox="0 0 64 64"
                                        aria-hidden="true"
                                    >
                                        <use href="#bowl" />
                                    </svg>
                                </div>
                                <b style="font-weight: 600">Tonkotsu ramen</b
                                ><span
                                    class="chip"
                                    style="
                                        background: #fbdccf;
                                        color: #7a2a10;
                                        align-self: flex-start;
                                    "
                                    >Sold out</span
                                >
                            </button>
                        </div>
                    </div>
                    <aside
                        class="card"
                        style="
                            flex: 0 1 400px;
                            min-width: 300px;
                            display: flex;
                            flex-direction: column;
                            gap: 16px;
                        "
                    >
                        <p class="h2" style="margin: 0">Order</p>
                        <div class="ln">
                            <span style="flex: 1">Salmon nigiri</span>
                            <div class="st">
                                <button class="sb" aria-label="Remove one">−</button><b>2</b
                                ><button class="sb" aria-label="Add one">+</button>
                            </div>
                            <b style="width: 64px; text-align: right">₱240</b>
                        </div>
                        <div class="ln">
                            <span style="flex: 1">California maki</span>
                            <div class="st">
                                <button class="sb" aria-label="Remove one">−</button><b>1</b
                                ><button class="sb" aria-label="Add one">+</button>
                            </div>
                            <b style="width: 64px; text-align: right">₱180</b>
                        </div>
                        <div class="ln">
                            <span style="flex: 1">Chicken katsu curry</span>
                            <div class="st">
                                <button class="sb" aria-label="Remove one">−</button><b>1</b
                                ><button class="sb" aria-label="Add one">+</button>
                            </div>
                            <b style="width: 64px; text-align: right">₱210</b>
                        </div>
                        <div>
                            <b style="font-size: 15px">Quick notes</b>
                            <div class="r" style="flex-wrap: wrap; gap: 8px; margin-top: 10px">
                                <button
                                    class="qn"
                                    style="
                                        background: #f8e7a6;
                                        border-color: #f8e7a6;
                                        font-weight: 600;
                                    "
                                >
                                    No wasabi</button
                                ><button class="qn" style="">Less spicy</button
                                ><button class="qn" style="">Allergy</button
                                ><button class="qn" style="">Rush</button>
                            </div>
                        </div>
                        <div
                            class="ln"
                            style="
                                border-top: 2px dashed #d8d6cf;
                                padding-top: 16px;
                                font-size: 22px;
                            "
                        >
                            <b>Total</b><b>₱630.00</b>
                        </div>
                        <button
                            class="btn pri"
                            style="width: 100%; min-height: 68px; font-size: 20px"
                        >
                            Send to kitchen</button
                        ><button class="btn sec" style="width: 100%">Hold order</button>
                    </aside>
                </div>
            </div>
        </div>
    </body>
</html>
