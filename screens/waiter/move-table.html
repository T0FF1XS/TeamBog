<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay move table</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Move or merge, Table 6</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Waiter</span
                    ><b>6:42 PM</b>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                    <div style="flex: 1 1 600px">
                        <div class="r" style="margin-bottom: 16px; flex-wrap: wrap">
                            <div class="r" style="flex-wrap: wrap; gap: 8px">
                                <button
                                    class="qn"
                                    style="background: #1b1d1f; color: #fff; border-color: #1b1d1f"
                                >
                                    Move to a free table</button
                                ><button class="qn" style="">Merge with a table</button>
                            </div>
                        </div>
                        <div
                            style="
                                display: grid;
                                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                                gap: 14px;
                            "
                        >
                            <button
                                class="tb"
                                style="background: #1b1d1f; color: #fff; min-height: 110px"
                            >
                                <b style="font-size: 24px">Table 3</b
                                ><span style="font-size: 14px">Free</span></button
                            ><button
                                class="tb"
                                style="
                                    background: #fff;
                                    box-shadow: inset 0 0 0 3px #dad8d1;
                                    min-height: 110px;
                                "
                            >
                                <b style="font-size: 24px">Table 5</b
                                ><span style="font-size: 14px">Free</span></button
                            ><button
                                class="tb"
                                style="
                                    background: #fff;
                                    box-shadow: inset 0 0 0 3px #dad8d1;
                                    min-height: 110px;
                                "
                            >
                                <b style="font-size: 24px">Table 7</b
                                ><span style="font-size: 14px">Free</span></button
                            ><button
                                class="tb"
                                style="
                                    background: #fff;
                                    box-shadow: inset 0 0 0 3px #dad8d1;
                                    min-height: 110px;
                                "
                            >
                                <b style="font-size: 24px">Table 10</b
                                ><span style="font-size: 14px">Free</span></button
                            ><button class="tb" style="background: #cfe3d3; min-height: 110px">
                                <b style="font-size: 24px">Table 1</b
                                ><span style="font-size: 14px">In use</span></button
                            ><button class="tb" style="background: #cfe3d3; min-height: 110px">
                                <b style="font-size: 24px">Table 4</b
                                ><span style="font-size: 14px">In use</span>
                            </button>
                        </div>
                    </div>
                    <aside class="card" style="flex: 0 1 360px; min-width: 300px">
                        <p class="h2">Summary</p>
                        <p style="margin: 0; font-size: 17px">Table 6 moves to <b>Table 3</b>.</p>
                        <p style="margin: 8px 0 18px; font-size: 14px; color: #5b5f63">
                            The order and timer move with it. The kitchen sees the new table number.
                        </p>
                        <button
                            class="btn pri"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                width: 100%;
                                min-height: 60px;
                            "
                        >
                            Move order
                        </button>
                        <div style="height: 12px"></div>
                        <button
                            class="btn sec"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                width: 100%;
                                min-height: 56px;
                            "
                        >
                            Cancel
                        </button>
                    </aside>
                </div>
                <nav class="tabs">
                    <a class="tab on" href="../waiter/tables.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="6" />
                            <path d="M12 2v2M12 20v2M2 12h2M20 12h2" /></svg
                        >Tables</a
                    ><a class="tab" href="../waiter/ready-to-serve.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M5 13l4 4L19 7" /></svg
                        >Ready to serve</a
                    ><a class="tab" href="../kitchen/menu-status.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Menu status</a
                    ><a class="tab" href="../owner/delivery.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="6" cy="17" r="3" />
                            <circle cx="18" cy="17" r="3" />
                            <path d="M9 17h6l-3-8H9M15 9h3l1 5" /></svg
                        >Delivery</a
                    >
                </nav>
            </div>
        </div>
    </body>
</html>
