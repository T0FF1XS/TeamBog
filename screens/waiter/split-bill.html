<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay split bill</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Split bill, Table 6</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Waiter</span
                    ><b>6:42 PM</b>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                    <div class="card" style="flex: 1 1 600px; padding: 18px">
                        <div class="r" style="justify-content: space-between; margin-bottom: 10px">
                            <p class="h2" style="margin: 0">Who ordered what?</p>
                            <div class="r" style="flex-wrap: wrap; gap: 8px">
                                <button
                                    class="qn"
                                    style="background: #1b1d1f; color: #fff; border-color: #1b1d1f"
                                >
                                    By item</button
                                ><button class="qn" style="">Evenly</button>
                            </div>
                        </div>
                        <div
                            style="
                                display: flex;
                                flex-direction: column;
                                gap: 14px;
                                margin-top: 10px;
                            "
                        >
                            <div class="ln">
                                <span>2× Salmon nigiri</span
                                ><span class="r" style="gap: 8px"
                                    ><span
                                        class="chip"
                                        style="background: #cfe3d3; min-height: 34px"
                                        >Diner 1</span
                                    ><b>₱240.00</b></span
                                >
                            </div>
                            <div class="ln">
                                <span>1× California maki</span
                                ><span class="r" style="gap: 8px"
                                    ><span
                                        class="chip"
                                        style="background: #fbefc0; min-height: 34px"
                                        >Diner 2</span
                                    ><b>₱180.00</b></span
                                >
                            </div>
                            <div class="ln">
                                <span>1× Chicken katsu curry</span
                                ><span class="r" style="gap: 8px"
                                    ><span
                                        class="chip"
                                        style="background: #fbdccf; min-height: 34px"
                                        >Diner 3</span
                                    ><b>₱210.00</b></span
                                >
                            </div>
                        </div>
                    </div>
                    <aside class="card" style="flex: 0 1 380px; min-width: 300px">
                        <p class="h2">Each pays</p>
                        <div
                            style="
                                display: flex;
                                flex-direction: column;
                                gap: 12px;
                                font-size: 18px;
                            "
                        >
                            <div class="ln"><span>Diner 1</span><b>₱240.00</b></div>
                            <div class="ln"><span>Diner 2</span><b>₱180.00</b></div>
                            <div class="ln"><span>Diner 3</span><b>₱210.00</b></div>
                        </div>
                        <div
                            class="ln"
                            style="
                                border-top: 2px dashed #d8d6cf;
                                margin-top: 16px;
                                padding-top: 14px;
                                font-size: 22px;
                            "
                        >
                            <b>Total</b><b>₱630.00</b>
                        </div>
                        <div style="margin-top: 18px">
                            <button
                                class="btn pri"
                                style="
                                    min-height: 48px;
                                    font-size: 15px;
                                    padding: 0 18px;
                                    width: 100%;
                                    min-height: 60px;
                                "
                            >
                                Create 3 bills
                            </button>
                        </div>
                    </aside>
                </div>
                <nav class="tabs">
                    <a class="tab on" href="../waiter/tables.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="6" />
                            <path d="M12 2v2M12 20v2M2 12h2M20 12h2" /></svg
                        >Tables</a
                    ><a class="tab" href="../waiter/ready-to-serve.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M5 13l4 4L19 7" /></svg
                        >Ready to serve</a
                    ><a class="tab" href="../kitchen/menu-status.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Menu status</a
                    ><a class="tab" href="../owner/delivery.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="6" cy="17" r="3" />
                            <circle cx="18" cy="17" r="3" />
                            <path d="M9 17h6l-3-8H9M15 9h3l1 5" /></svg
                        >Delivery</a
                    >
                </nav>
            </div>
        </div>
    </body>
</html>
