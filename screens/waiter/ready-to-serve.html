<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay ready to serve</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Ready to serve</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Waiter</span
                    ><b>6:42 PM</b>
                </div>
                <div
                    style="
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                        gap: 18px;
                    "
                >
                    <div class="card" style="display: flex; flex-direction: column; gap: 12px">
                        <div class="r" style="justify-content: space-between">
                            <b style="font-size: 26px; font-weight: 600">Table 1</b
                            ><span class="chip" style="background: #cfe3d3; color: #2d5a3a"
                                >Waiting 1:20</span
                            >
                        </div>
                        <div style="font-size: 19px; line-height: 1.5">
                            2× Iced matcha<br />1× California maki
                        </div>
                        <button
                            class="btn pri"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                min-height: 60px;
                                font-size: 18px;
                            "
                        >
                            Mark served
                        </button>
                    </div>
                    <div class="card" style="display: flex; flex-direction: column; gap: 12px">
                        <div class="r" style="justify-content: space-between">
                            <b style="font-size: 26px; font-weight: 600">Table 2</b
                            ><span class="chip" style="background: #cfe3d3; color: #2d5a3a"
                                >Waiting 0:45</span
                            >
                        </div>
                        <div style="font-size: 19px; line-height: 1.5">
                            1× Ebi tempura<br />1× Miso soup
                        </div>
                        <button
                            class="btn pri"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                min-height: 60px;
                                font-size: 18px;
                            "
                        >
                            Mark served
                        </button>
                    </div>
                    <div class="card" style="display: flex; flex-direction: column; gap: 12px">
                        <div class="r" style="justify-content: space-between">
                            <b style="font-size: 26px; font-weight: 600">Takeout 8</b
                            ><span class="chip" style="background: #f8e7a6; color: #5a4300"
                                >Pickup</span
                            >
                        </div>
                        <div style="font-size: 19px; line-height: 1.5">1× California maki</div>
                        <button
                            class="btn pri"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                min-height: 60px;
                                font-size: 18px;
                            "
                        >
                            Mark served
                        </button>
                    </div>
                </div>
                <nav class="tabs">
                    <a class="tab" href="../waiter/tables.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="6" />
                            <path d="M12 2v2M12 20v2M2 12h2M20 12h2" /></svg
                        >Tables</a
                    ><a class="tab on" href="../waiter/ready-to-serve.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M5 13l4 4L19 7" /></svg
                        >Ready to serve</a
                    ><a class="tab" href="../kitchen/menu-status.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Menu status</a
                    ><a class="tab" href="../owner/delivery.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="6" cy="17" r="3" />
                            <circle cx="18" cy="17" r="3" />
                            <path d="M9 17h6l-3-8H9M15 9h3l1 5" /></svg
                        >Delivery</a
                    >
                </nav>
            </div>
        </div>
    </body>
</html>
