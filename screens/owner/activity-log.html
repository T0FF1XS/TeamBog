<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay activity log</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Activity log</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Owner</span
                    ><b>6:42 PM</b>
                </div>
                <div class="card" style="padding: 18px">
                    <div class="r" style="flex-wrap: wrap; margin-bottom: 10px">
                        <div class="r" style="flex-wrap: wrap; gap: 8px">
                            <button
                                class="qn"
                                style="background: #1b1d1f; color: #fff; border-color: #1b1d1f"
                            >
                                Everything</button
                            ><button class="qn" style="">Voids</button
                            ><button class="qn" style="">Price changes</button
                            ><button class="qn" style="">Discounts</button
                            ><button class="qn" style="">Sign-ins</button>
                        </div>
                    </div>
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Who</th>
                                <th>What happened</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>6:44 PM</td>
                                <td>Cashier 1</td>
                                <td>Voided order 0038, reason: customer left</td>
                            </tr>
                            <tr>
                                <td>6:20 PM</td>
                                <td>Cashier 1</td>
                                <td>Applied Senior discount on order 0041</td>
                            </tr>
                            <tr>
                                <td>5:58 PM</td>
                                <td>Owner</td>
                                <td>Changed price of Gyoza</td>
                            </tr>
                            <tr>
                                <td>5:30 PM</td>
                                <td>Kitchen 1</td>
                                <td>Marked Tonkotsu ramen as sold out</td>
                            </tr>
                            <tr>
                                <td>5:02 PM</td>
                                <td>Waiter 1</td>
                                <td>Signed in</td>
                            </tr>
                        </tbody>
                    </table>
                    <p style="margin: 14px 12px 0; font-size: 13px; color: #5b5f63">Sample data.</p>
                </div>
            </div>
        </div>
    </body>
</html>
