<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay feedback</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Guest feedback</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Owner</span
                    ><b>6:42 PM</b>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                    <div class="card" style="flex: 1 1 600px; padding: 18px">
                        <p class="h2">Recent comments</p>
                        <div style="display: flex; flex-direction: column; gap: 16px">
                            <div>
                                <div class="r" style="justify-content: space-between">
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >5 stars</span
                                    ><span style="font-size: 13px; color: #5b5f63">Today</span>
                                </div>
                                <p style="margin: 8px 0 0; font-size: 16px">
                                    Sample comment about the food.
                                </p>
                            </div>
                            <div>
                                <div class="r" style="justify-content: space-between">
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >4 stars</span
                                    ><span style="font-size: 13px; color: #5b5f63">Today</span>
                                </div>
                                <p style="margin: 8px 0 0; font-size: 16px">
                                    Sample comment about the service.
                                </p>
                            </div>
                            <div>
                                <div class="r" style="justify-content: space-between">
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >5 stars</span
                                    ><span style="font-size: 13px; color: #5b5f63">Yesterday</span>
                                </div>
                                <p style="margin: 8px 0 0; font-size: 16px">
                                    Sample comment about the wait time.
                                </p>
                            </div>
                        </div>
                    </div>
                    <aside class="card" style="flex: 0 1 360px; min-width: 300px">
                        <p class="h2">Rating</p>
                        <div style="font-size: 56px; font-weight: 600; line-height: 1">4.7</div>
                        <p style="margin: 4px 0 16px; color: #5b5f63; font-size: 14px">
                            18 reviews, sample data
                        </p>
                        <div style="display: flex; flex-direction: column; gap: 10px">
                            <div class="r" style="font-size: 14px">
                                <b style="width: 28px">5★</b>
                                <div
                                    style="
                                        flex: 1;
                                        height: 10px;
                                        border-radius: 9px;
                                        background: #eceae4;
                                    "
                                >
                                    <div
                                        style="
                                            height: 10px;
                                            width: 72%;
                                            border-radius: 9px;
                                            background: #f4b49c;
                                        "
                                    ></div>
                                </div>
                                <span style="width: 28px; text-align: right">13</span>
                            </div>
                            <div class="r" style="font-size: 14px">
                                <b style="width: 28px">4★</b>
                                <div
                                    style="
                                        flex: 1;
                                        height: 10px;
                                        border-radius: 9px;
                                        background: #eceae4;
                                    "
                                >
                                    <div
                                        style="
                                            height: 10px;
                                            width: 20%;
                                            border-radius: 9px;
                                            background: #f4b49c;
                                        "
                                    ></div>
                                </div>
                                <span style="width: 28px; text-align: right">4</span>
                            </div>
                            <div class="r" style="font-size: 14px">
                                <b style="width: 28px">3★</b>
                                <div
                                    style="
                                        flex: 1;
                                        height: 10px;
                                        border-radius: 9px;
                                        background: #eceae4;
                                    "
                                >
                                    <div
                                        style="
                                            height: 10px;
                                            width: 6%;
                                            border-radius: 9px;
                                            background: #f4b49c;
                                        "
                                    ></div>
                                </div>
                                <span style="width: 28px; text-align: right">1</span>
                            </div>
                            <div class="r" style="font-size: 14px">
                                <b style="width: 28px">2★</b>
                                <div
                                    style="
                                        flex: 1;
                                        height: 10px;
                                        border-radius: 9px;
                                        background: #eceae4;
                                    "
                                >
                                    <div
                                        style="
                                            height: 10px;
                                            width: 0%;
                                            border-radius: 9px;
                                            background: #f4b49c;
                                        "
                                    ></div>
                                </div>
                                <span style="width: 28px; text-align: right">0</span>
                            </div>
                            <div class="r" style="font-size: 14px">
                                <b style="width: 28px">1★</b>
                                <div
                                    style="
                                        flex: 1;
                                        height: 10px;
                                        border-radius: 9px;
                                        background: #eceae4;
                                    "
                                >
                                    <div
                                        style="
                                            height: 10px;
                                            width: 0%;
                                            border-radius: 9px;
                                            background: #f4b49c;
                                        "
                                    ></div>
                                </div>
                                <span style="width: 28px; text-align: right">0</span>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </body>
</html>
