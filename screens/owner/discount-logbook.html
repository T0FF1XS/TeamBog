<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay discount logbook</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Discount logbook</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Owner</span
                    ><b>6:42 PM</b>
                </div>
                <div class="card" style="padding: 18px">
                    <div
                        class="r"
                        style="flex-wrap: wrap; justify-content: space-between; margin-bottom: 10px"
                    >
                        <div class="r" style="gap: 8px">
                            <div class="r" style="flex-wrap: wrap; gap: 8px">
                                <button
                                    class="qn"
                                    style="background: #1b1d1f; color: #fff; border-color: #1b1d1f"
                                >
                                    This month</button
                                ><button class="qn" style="">Last month</button>
                            </div>
                            <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                >Senior, 3</span
                            ><span class="chip" style="background: #eceae4; color: #1b1d1f"
                                >PWD, 2</span
                            >
                        </div>
                        <button
                            class="btn pri"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                min-height: 50px;
                            "
                        >
                            Export for the accountant
                        </button>
                    </div>
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Order</th>
                                <th>Type</th>
                                <th>Name on ID</th>
                                <th>ID number</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Nov 3</td>
                                <td>0041</td>
                                <td>
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >Senior</span
                                    >
                                </td>
                                <td>Sample Name 1</td>
                                <td>Sample ID</td>
                            </tr>
                            <tr>
                                <td>Nov 3</td>
                                <td>0039</td>
                                <td>
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >PWD</span
                                    >
                                </td>
                                <td>Sample Name 2</td>
                                <td>Sample ID</td>
                            </tr>
                            <tr>
                                <td>Nov 2</td>
                                <td>0031</td>
                                <td>
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >Senior</span
                                    >
                                </td>
                                <td>Sample Name 3</td>
                                <td>Sample ID</td>
                            </tr>
                            <tr>
                                <td>Nov 2</td>
                                <td>0027</td>
                                <td>
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >Senior</span
                                    >
                                </td>
                                <td>Sample Name 4</td>
                                <td>Sample ID</td>
                            </tr>
                            <tr>
                                <td>Nov 1</td>
                                <td>0012</td>
                                <td>
                                    <span class="chip" style="background: #eceae4; color: #1b1d1f"
                                        >PWD</span
                                    >
                                </td>
                                <td>Sample Name 5</td>
                                <td>Sample ID</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
