<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay staff</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 940px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Staff</h1>
                    <span id="staff-name" class="chip" style="background: #fff; margin-left: auto"
                        >Owner</span
                    >
                </div>
                <div class="staff-layout">
                    <div class="card staff-accounts-card">
                        <div class="r" style="justify-content: space-between; margin-bottom: 8px">
                            <p class="h2" style="margin: 0">Accounts</p>
                            <button
                                type="button"
                                id="focus-staff-form"
                                class="btn pri"
                                style="
                                    min-height: 48px;
                                    font-size: 15px;
                                    padding: 0 18px;
                                    min-height: 44px;
                                "
                            >
                                Add staff
                            </button>
                        </div>
                        <div class="staff-table-scroll">
                            <table class="tbl">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="staff-list">
                                    <tr>
                                        <td colspan="5">Loading staff accounts…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <aside class="card staff-add-card">
                        <h2 id="staff-form-title" class="h2" style="margin: 0">Add staff</h2>
                        <div id="staff-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
                        <form id="staff-form">
                            <input id="staff-id" type="hidden" />
                            <label class="lbl" for="new-staff-name">Name</label>
                            <input
                                id="new-staff-name"
                                class="inp"
                                name="name"
                                maxlength="100"
                                autocomplete="off"
                                required
                            />
                            <fieldset class="role-fieldset">
                                <legend class="lbl">Role</legend>
                                <div class="r role-options" role="group" aria-label="Staff role">
                                    <button
                                        type="button"
                                        class="qn"
                                        data-role="waiter"
                                        aria-pressed="true"
                                    >
                                        Waiter
                                    </button>
                                    <button
                                        type="button"
                                        class="qn"
                                        data-role="kitchen"
                                        aria-pressed="false"
                                    >
                                        Kitchen
                                    </button>
                                    <button
                                        type="button"
                                        class="qn"
                                        data-role="cashier"
                                        aria-pressed="false"
                                    >
                                        Cashier
                                    </button>
                                    <button
                                        type="button"
                                        class="qn"
                                        data-role="owner"
                                        aria-pressed="false"
                                    >
                                        Owner
                                    </button>
                                </div>
                            </fieldset>
                            <label class="lbl" for="new-staff-pin">4-digit PIN</label>
                            <input
                                id="new-staff-pin"
                                class="inp"
                                name="pin"
                                type="password"
                                inputmode="numeric"
                                pattern="[0-9]{4}"
                                minlength="4"
                                maxlength="4"
                                autocomplete="new-password"
                                aria-describedby="pin-help"
                                required
                            />
                            <p id="pin-help" class="field-help">
                                Use a PIN not already assigned to an active account with this role.
                            </p>
                            <button
                                id="create-staff"
                                type="submit"
                                class="btn pri"
                                disabled
                                style="width: 100%; min-height: 58px; margin-top: 8px"
                            >
                                Create account
                            </button>
                            <button
                                id="cancel-staff-edit"
                                type="button"
                                class="btn sec"
                                hidden
                                style="width: 100%; min-height: 48px; margin-top: 12px"
                            >
                                Cancel
                            </button>
                        </form>
                    </aside>
                </div>
                <nav class="tabs">
                    <a class="tab" href="../owner/reports.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg
                        >Reports</a
                    ><a class="tab" href="../cashier/orders.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" />
                            <path d="M9 8h6M9 12h6" /></svg
                        >Orders</a
                    ><a class="tab" href="../owner/menu-manager.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Menu</a
                    ><a class="tab" href="../owner/inventory.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M3 8l9-5 9 5v8l-9 5-9-5z" />
                            <path d="M3 8l9 5 9-5M12 13v8" /></svg
                        >Inventory</a
                    ><a class="tab" href="../owner/delivery.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="6" cy="17" r="3" />
                            <circle cx="18" cy="17" r="3" />
                            <path d="M9 17h6l-3-8H9M15 9h3l1 5" /></svg
                        >Delivery</a
                    ><a class="tab on" href="../owner/staff.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="9" cy="8" r="3.5" />
                            <path
                                d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-4-5.5"
                            /></svg
                        >Staff</a
                    >
                </nav>
            </div>
        </div>
        <script>
            var csrfToken = "";
            var selectedRole = "waiter";
            var staffForm = document.getElementById("staff-form");
            var staffFeedback = document.getElementById("staff-feedback");
            var staffList = document.getElementById("staff-list");
            var roleButtons = document.querySelectorAll("[data-role]");
            var staffFormMode = "create";
            var currentStaffId = null;

            function showStaffFeedback(message, success) {
                staffFeedback.textContent = message;
                staffFeedback.className =
                    "feedback " + (success ? "feedback-success" : "feedback-error");
                staffFeedback.hidden = false;
            }

            async function readJsonResponse(response, fallbackMessage) {
                var result;
                try {
                    result = await response.json();
                } catch (error) {
                    throw new Error(fallbackMessage);
                }
                if (!response.ok) {
                    throw new Error(result.error || fallbackMessage);
                }
                return result;
            }

            function addCell(row, value) {
                var cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
                return cell;
            }

            function renderStaff(accounts) {
                staffList.textContent = "";
                if (accounts.length === 0) {
                    var emptyRow = document.createElement("tr");
                    var emptyCell = addCell(emptyRow, "No staff accounts yet.");
                    emptyCell.colSpan = 5;
                    staffList.appendChild(emptyRow);
                    return;
                }

                accounts.forEach(function (account) {
                    var row = document.createElement("tr");
                    addCell(row, account.name);

                    var roleCell = addCell(row, "");
                    var roleBadge = document.createElement("span");
                    roleBadge.className = "chip role-badge-" + account.role;
                    roleBadge.textContent =
                        account.role.charAt(0).toUpperCase() + account.role.slice(1);
                    roleCell.appendChild(roleBadge);

                    var statusCell = addCell(row, "");
                    var statusBadge = document.createElement("span");
                    statusBadge.className =
                        "chip " + (account.active ? "account-active" : "account-inactive");
                    statusBadge.textContent = account.active ? "Active" : "Off";
                    statusCell.appendChild(statusBadge);

                    var createdAt = new Date(String(account.createdAt).replace(" ", "T"));
                    var createdLabel = Number.isNaN(createdAt.getTime())
                        ? String(account.createdAt)
                        : createdAt.toLocaleString();
                    addCell(row, createdLabel);

                    var actionsCell = document.createElement("td");
                    var actions = document.createElement("div");
                    actions.className = "staff-row-actions";
                    var editButton = document.createElement("button");
                    editButton.type = "button";
                    editButton.className = "btn sec staff-action";
                    editButton.textContent = "Edit";
                    editButton.addEventListener("click", function () {
                        setStaffFormMode("update", account);
                    });
                    actions.appendChild(editButton);

                    var statusButton = document.createElement("button");
                    statusButton.type = "button";
                    statusButton.className =
                        "btn " + (account.active ? "sec" : "pri") + " staff-action";
                    statusButton.textContent = account.active ? "Deactivate" : "Reactivate";
                    statusButton.disabled = account.active && account.id === currentStaffId;
                    statusButton.addEventListener("click", function () {
                        if (account.active) {
                            if (
                                !window.confirm(
                                    "Deactivate " +
                                        account.name +
                                        "? They will no longer be able to sign in.",
                                )
                            ) {
                                return;
                            }
                            updateStaffStatus(account.id, "deactivate");
                        } else {
                            setStaffFormMode("activate", account);
                        }
                    });
                    actions.appendChild(statusButton);
                    actionsCell.appendChild(actions);
                    row.appendChild(actionsCell);
                    staffList.appendChild(row);
                });
            }

            function setStaffFormMode(mode, account) {
                staffFormMode = mode;
                staffForm.reset();
                selectRole("waiter");
                document.getElementById("staff-id").value = "";
                document.getElementById("new-staff-name").disabled = false;
                document.getElementById("new-staff-pin").disabled = false;
                document.getElementById("new-staff-pin").required = mode !== "update";
                roleButtons.forEach(function (button) {
                    button.disabled = false;
                });
                document.getElementById("cancel-staff-edit").hidden = mode === "create";

                if (mode === "create") {
                    document.getElementById("staff-form-title").textContent = "Add staff";
                    document.getElementById("create-staff").textContent = "Create account";
                    document.getElementById("pin-help").textContent =
                        "Use a PIN not already assigned to an active account with this role.";
                    return;
                }

                document.getElementById("staff-id").value = account.id;
                document.getElementById("new-staff-name").value = account.name;
                selectRole(account.role);
                document.getElementById("staff-form-title").textContent =
                    mode === "activate" ? "Reactivate staff" : "Edit staff";
                document.getElementById("create-staff").textContent =
                    mode === "activate" ? "Reactivate account" : "Save changes";
                if (mode === "update") {
                    document.getElementById("new-staff-pin").required = false;
                    document.getElementById("pin-help").textContent =
                        "Leave blank to keep the current PIN. Enter a new PIN to reset it; changing a role requires a new PIN.";
                    if (account.id === currentStaffId) {
                        roleButtons.forEach(function (button) {
                            button.disabled = true;
                        });
                    }
                } else {
                    document.getElementById("new-staff-name").disabled = true;
                    roleButtons.forEach(function (button) {
                        button.disabled = true;
                    });
                    document.getElementById("pin-help").textContent =
                        "Enter a new 4-digit PIN to reactivate this account.";
                }
            }

            function selectRole(role) {
                selectedRole = role;
                roleButtons.forEach(function (button) {
                    button.setAttribute(
                        "aria-pressed",
                        button.getAttribute("data-role") === role ? "true" : "false",
                    );
                });
            }

            roleButtons.forEach(function (button) {
                button.addEventListener("click", function () {
                    selectRole(button.getAttribute("data-role"));
                });
            });

            async function loadStaff() {
                try {
                    var sessionResponse = await fetch("../../api/auth/session.php");
                    if (sessionResponse.status === 401) {
                        window.location.replace("../../core/login.html");
                        return false;
                    }
                    var session = await readJsonResponse(
                        sessionResponse,
                        "Could not verify your staff session.",
                    );
                    if (session.staff.role !== "owner") {
                        throw new Error("Only an owner can manage staff accounts.");
                    }
                    currentStaffId = session.staff.id;
                    csrfToken = session.csrfToken;
                    document.getElementById("staff-name").textContent = session.staff.name;
                    document.getElementById("create-staff").disabled = false;

                    var response = await fetch("../../api/staff.php");
                    if (response.status === 401) {
                        window.location.replace("../../core/login.html");
                        return false;
                    }
                    var result = await readJsonResponse(response, "Could not load staff accounts.");
                    if (!Array.isArray(result.staff)) {
                        throw new Error("The staff list response was invalid.");
                    }
                    renderStaff(result.staff);
                    return true;
                } catch (error) {
                    staffList.textContent = "";
                    var errorRow = document.createElement("tr");
                    var errorCell = addCell(errorRow, "Staff accounts could not be loaded.");
                    errorCell.colSpan = 5;
                    staffList.appendChild(errorRow);
                    showStaffFeedback(error.message, false);
                    return false;
                }
            }

            document.getElementById("focus-staff-form").addEventListener("click", function () {
                setStaffFormMode("create");
                var nameInput = document.getElementById("new-staff-name");
                nameInput.focus();
                nameInput.scrollIntoView({
                    behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches
                        ? "auto"
                        : "smooth",
                    block: "center",
                });
            });

            document.getElementById("cancel-staff-edit").addEventListener("click", function () {
                setStaffFormMode("create");
            });

            async function updateStaffStatus(id, action) {
                try {
                    var response = await fetch("../../api/staff.php", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRF-Token": csrfToken,
                        },
                        body: JSON.stringify({ action: action, id: id }),
                    });
                    await readJsonResponse(response, "Staff account status could not be changed.");
                    if (await loadStaff()) {
                        showStaffFeedback(
                            action === "deactivate"
                                ? "Staff account deactivated."
                                : "Staff account reactivated.",
                            true,
                        );
                    }
                } catch (error) {
                    showStaffFeedback(error.message, false);
                }
            }

            staffForm.addEventListener("submit", async function (event) {
                event.preventDefault();
                var name = document.getElementById("new-staff-name").value.trim();
                var submitButton = document.getElementById("create-staff");
                submitButton.disabled = true;
                staffFeedback.hidden = true;

                try {
                    var payload = {
                        action: staffFormMode,
                        id: Number(document.getElementById("staff-id").value),
                        pin: document.getElementById("new-staff-pin").value,
                    };
                    if (staffFormMode !== "activate") {
                        payload.name = name;
                        payload.role = selectedRole;
                    }
                    var response = await fetch("../../api/staff.php", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRF-Token": csrfToken,
                        },
                        body: JSON.stringify(payload),
                    });
                    await readJsonResponse(response, "Staff account could not be saved.");
                    var successMessage =
                        staffFormMode === "create"
                            ? "Staff account created."
                            : staffFormMode === "activate"
                              ? "Staff account reactivated."
                              : "Staff account updated.";
                    setStaffFormMode("create");
                    if (await loadStaff()) {
                        showStaffFeedback(successMessage, true);
                    } else {
                        showStaffFeedback(
                            "The account was created, but the staff list could not be refreshed. Reload to verify it.",
                            false,
                        );
                    }
                } catch (error) {
                    showStaffFeedback(error.message, false);
                } finally {
                    submitButton.disabled = false;
                }
            });

            loadStaff();
        </script>
    </body>
</html>
