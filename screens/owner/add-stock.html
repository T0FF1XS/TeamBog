<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay add stock</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Add stock</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Owner</span
                    ><b>6:42 PM</b>
                </div>
                <div class="card" style="padding: 18px">
                    <div class="r" style="flex-wrap: wrap; gap: 16px; margin-bottom: 6px">
                        <div style="flex: 1; min-width: 240px">
                            <label class="lbl" for="as1">Supplier or note</label
                            ><input id="as1" class="inp" value="Morning delivery" />
                        </div>
                        <div style="flex: 0 0 220px">
                            <label class="lbl" for="as2">Date received</label
                            ><input id="as2" class="inp" value="Nov 3" />
                        </div>
                    </div>
                    <div style="margin-top: 8px">
                        <table class="tbl">
                            <thead>
                                <tr>
                                    <th>Ingredient</th>
                                    <th>Amount</th>
                                    <th>Unit</th>
                                    <th>Expiry date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <input class="inp" value="Salmon" aria-label="Ingredient" />
                                    </td>
                                    <td>
                                        <input
                                            class="inp"
                                            value="3"
                                            aria-label="Amount"
                                            style="width: 110px"
                                        />
                                    </td>
                                    <td>kg</td>
                                    <td>
                                        <input
                                            class="inp"
                                            value="Nov 9"
                                            aria-label="Expiry"
                                            style="width: 140px"
                                        />
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input
                                            class="inp"
                                            value="Nori sheets"
                                            aria-label="Ingredient"
                                        />
                                    </td>
                                    <td>
                                        <input
                                            class="inp"
                                            value="100"
                                            aria-label="Amount"
                                            style="width: 110px"
                                        />
                                    </td>
                                    <td>pcs</td>
                                    <td>
                                        <input
                                            class="inp"
                                            value="Nov 30"
                                            aria-label="Expiry"
                                            style="width: 140px"
                                        />
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input
                                            class="inp"
                                            value="Ebi (shrimp)"
                                            aria-label="Ingredient"
                                        />
                                    </td>
                                    <td>
                                        <input
                                            class="inp"
                                            value="2"
                                            aria-label="Amount"
                                            style="width: 110px"
                                        />
                                    </td>
                                    <td>kg</td>
                                    <td>
                                        <input
                                            class="inp"
                                            value="Nov 8"
                                            aria-label="Expiry"
                                            style="width: 140px"
                                        />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="r" style="margin-top: 16px; justify-content: space-between">
                        <button
                            class="btn sec"
                            style="min-height: 48px; font-size: 15px; padding: 0 18px"
                        >
                            Add another row</button
                        ><button
                            class="btn pri"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                min-height: 58px;
                                padding: 0 32px;
                            "
                        >
                            Save to stock
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
