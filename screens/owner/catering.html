<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay catering</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 940px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Catering</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Owner</span
                    ><b>6:42 PM</b>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                    <div class="card" style="flex: 1 1 600px; padding: 18px">
                        <p class="h2">Upcoming events</p>
                        <table class="tbl">
                            <thead>
                                <tr>
                                    <th>Event date</th>
                                    <th>Guests</th>
                                    <th>Client</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Nov 14</td>
                                    <td>40</td>
                                    <td>Client 1</td>
                                    <td>
                                        <span
                                            class="chip"
                                            style="background: #f8e7a6; color: #5a4300"
                                            >Quote sent</span
                                        >
                                    </td>
                                </tr>
                                <tr>
                                    <td>Nov 22</td>
                                    <td>25</td>
                                    <td>Client 2</td>
                                    <td>
                                        <span
                                            class="chip"
                                            style="background: #cfe3d3; color: #2d5a3a"
                                            >Deposit paid</span
                                        >
                                    </td>
                                </tr>
                                <tr>
                                    <td>Dec 6</td>
                                    <td>60</td>
                                    <td>Client 3</td>
                                    <td>
                                        <span
                                            class="chip"
                                            style="background: #eceae4; color: #1b1d1f"
                                            >Inquiry</span
                                        >
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <p style="margin: 14px 12px 0; font-size: 13px; color: #5b5f63">
                            Sample data.
                        </p>
                    </div>
                    <aside class="card" style="flex: 0 1 380px; min-width: 300px">
                        <p class="h2">New quotation</p>
                        <label class="lbl" for="q1">Client name</label
                        ><input id="q1" class="inp" value="" />
                        <div class="r" style="gap: 12px">
                            <div style="flex: 1">
                                <label class="lbl" for="q2">Event date</label
                                ><input id="q2" class="inp" value="" />
                            </div>
                            <div style="flex: 1">
                                <label class="lbl" for="q3">Guests</label
                                ><input id="q3" class="inp" value="" inputmode="numeric" />
                            </div>
                        </div>
                        <label class="lbl" for="q4">Venue</label
                        ><input id="q4" class="inp" value="" /><b class="lbl">Package</b>
                        <div class="r" style="flex-wrap: wrap; gap: 8px">
                            <button class="qn" style="">Package A</button
                            ><button class="qn" style="">Package B</button
                            ><button
                                class="qn"
                                style="background: #1b1d1f; color: #fff; border-color: #1b1d1f"
                            >
                                Custom
                            </button>
                        </div>
                        <div style="margin-top: 18px">
                            <button
                                class="btn pri"
                                style="
                                    min-height: 48px;
                                    font-size: 15px;
                                    padding: 0 18px;
                                    width: 100%;
                                    min-height: 58px;
                                "
                            >
                                Create quotation
                            </button>
                        </div>
                    </aside>
                </div>
                <nav class="tabs">
                    <a class="tab" href="../owner/reports.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Reports</a
                    ><a class="tab" href="../cashier/orders.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Orders</a
                    ><a class="tab" href="../owner/menu-manager.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Menu</a
                    ><a class="tab" href="../owner/inventory.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Inventory</a
                    ><a class="tab on" href="../owner/catering.html"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 6h16M4 12h16M4 18h10" /></svg
                        >Catering</a
                    >
                </nav>
            </div>
        </div>
    </body>
</html>
