<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay menu</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
        <style>
            .menu-table-scroll {
                max-width: 100%;
                overflow-x: auto;
            }
            .menu-table-scroll .tbl {
                min-width: 650px;
            }
            .menu-feedback {
                margin: 12px 0 0;
                padding: 12px 14px;
                border-radius: 14px;
                background: #fbe5df;
                color: #7a2a10;
            }
            .menu-feedback:empty {
                display: none;
            }
            .menu-state {
                display: inline-block;
                padding: 4px 9px;
                border-radius: 99px;
                background: #e2eee4;
                color: #2d5a3a;
                font-weight: 600;
            }
            .menu-state.unavailable,
            .menu-state.archived {
                background: #fbe5df;
                color: #7a2a10;
            }
            .menu-heading {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
        </style>
    </head>
    <body>
        <div class="pg">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <main class="wr">
                <header class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Menu</h1>
                    <span id="owner-name" class="chip" style="background: #fff; margin-left: auto"
                        >Owner</span
                    >
                </header>
                <section class="card">
                    <div class="menu-heading">
                        <div>
                            <h2 class="h2" style="margin: 0">Current menu</h2>
                            <p style="margin: 6px 0 0; color: #5b5f63">
                                Live items, portions, availability, and ingredient stock status.
                            </p>
                        </div>
                        <a class="btn pri" href="../../core/menu.html">Manage menu items</a>
                    </div>
                    <div class="menu-table-scroll" style="margin-top: 14px">
                        <table class="tbl">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Portions left</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="menu-list">
                                <tr><td colspan="5">Loading menu…</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <p id="menu-feedback" class="menu-feedback" role="status" aria-live="polite"></p>
                </section>
                <nav class="tabs" aria-label="Owner navigation">
                    <a class="tab" href="reports.html">Reports</a>
                    <a class="tab" href="../cashier/orders.html">Orders</a>
                    <a class="tab on" href="menu-manager.html" aria-current="page">Menu</a>
                    <a class="tab" href="inventory.html">Inventory</a>
                    <a class="tab" href="staff.html">Staff</a>
                    <a class="tab" href="qr-orders.html">Table QR</a>
                </nav>
            </main>
        </div>
        <script>
            async function readJson(response, message) {
                var result;
                try {
                    result = await response.json();
                } catch (error) {
                    throw new Error(message);
                }
                if (!response.ok) {
                    throw new Error(result.error || message);
                }
                return result;
            }

            function appendCell(row, value) {
                var cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
                return cell;
            }

            async function loadMenu() {
                var sessionResponse = await fetch("../../api/auth/session.php");
                if (sessionResponse.status === 401) {
                    window.location.replace("../../core/login.html");
                    return;
                }
                var session = await readJson(sessionResponse, "Could not verify the owner session.");
                if (session.staff.role !== "owner") {
                    throw new Error("Only an owner can view this menu.");
                }
                document.getElementById("owner-name").textContent = session.staff.name;
                var result = await readJson(
                    await fetch("../../api/menu.php?archived=1"),
                    "Could not load the current menu.",
                );
                var body = document.getElementById("menu-list");
                body.textContent = "";
                if (!result.items.length) {
                    var emptyRow = document.createElement("tr");
                    var emptyCell = document.createElement("td");
                    emptyCell.colSpan = 5;
                    emptyCell.textContent = "No menu items have been added.";
                    emptyRow.appendChild(emptyCell);
                    body.appendChild(emptyRow);
                    return;
                }
                result.items.forEach(function (item) {
                    var row = document.createElement("tr");
                    if (!item.active) {
                        row.className = "text-secondary";
                    }
                    appendCell(row, item.name);
                    appendCell(row, item.category);
                    appendCell(row, "₱" + Number(item.price).toFixed(2));
                    appendCell(
                        row,
                        item.portionsLeft === null ? "No limit" : String(item.portionsLeft),
                    );
                    var cell = document.createElement("td");
                    var state = document.createElement("span");
                    state.className = "menu-state";
                    if (!item.active) {
                        state.className += " archived";
                        state.textContent = "Archived";
                    } else if (!item.available) {
                        state.className += " unavailable";
                        state.textContent = item.inventoryAvailable ? "Unavailable" : "Low stock";
                    } else {
                        state.textContent = "Available";
                    }
                    cell.appendChild(state);
                    row.appendChild(cell);
                    body.appendChild(row);
                });
            }

            loadMenu().catch(function (error) {
                document.getElementById("menu-list").textContent = "";
                var row = document.createElement("tr");
                var cell = document.createElement("td");
                cell.colSpan = 5;
                cell.textContent = error.message;
                row.appendChild(cell);
                document.getElementById("menu-list").appendChild(row);
            });
        </script>
    </body>
</html>
