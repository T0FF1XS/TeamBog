<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay start shift</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div class="bar">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 56px; height: 56px"
                    />
                    <h1 class="h1">Start your shift</h1>
                    <span class="chip" style="background: #fff; margin-left: auto">Cashier</span
                    ><b>6:42 PM</b>
                </div>
                <div style="max-width: 620px; margin: 0 auto" class="card">
                    <p class="h2">Cash in the drawer</p>
                    <div style="font-size: 56px; font-weight: 600; letter-spacing: -0.02em">
                        ₱2,000.00
                    </div>
                    <div
                        style="
                            display: grid;
                            grid-template-columns: repeat(3, 1fr);
                            gap: 10px;
                            margin: 16px 0;
                        "
                    >
                        <button class="k">1000</button><button class="k">2000</button
                        ><button class="k">3000</button><button class="k">5000</button
                        ><button class="k">Other</button><button class="k">Clear</button>
                    </div>
                    <b class="lbl">Check before you start</b>
                    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 16px">
                        <label class="r"
                            ><input class="sw" type="checkbox" checked /> Receipt printer is
                            ready</label
                        ><label class="r"
                            ><input class="sw" type="checkbox" checked /> Cash drawer counted</label
                        >
                    </div>
                    <div style="margin-top: 22px">
                        <button
                            class="btn pri"
                            style="
                                min-height: 48px;
                                font-size: 15px;
                                padding: 0 18px;
                                width: 100%;
                                min-height: 64px;
                                font-size: 19px;
                            "
                        >
                            Start shift
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
