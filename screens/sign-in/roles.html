<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay who is using</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 760px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div style="text-align: center; padding: 40px 0 30px">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant by Little Sushi Bar"
                        style="display: block; margin: 0 auto 18px; width: 170px; height: 170px"
                    />
                    <h1 class="h1" style="font-size: 72px">Who is using Lanay?</h1>
                    <p style="font-size: 18px; color: #5b5f63; margin: 10px 0 0">
                        Tap your role, then enter your PIN.
                    </p>
                </div>
                <div
                    style="
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
                        gap: 20px;
                    "
                >
                    <a class="role" href="pin.html?role=waiter" style="background: #cfe3d3"
                        ><span
                            style="
                                width: 72px;
                                height: 72px;
                                border-radius: 24px;
                                background: rgba(255, 255, 255, 0.7);
                                display: grid;
                                place-items: center;
                            "
                            ><svg
                                width="36"
                                height="36"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M3 16h18M5 16a7 7 0 0 1 14 0M12 8V5" /></svg></span
                        ><span
                            ><b style="font-size: 30px; font-weight: 600; display: block">Waiter</b
                            ><span style="font-size: 16px">Tables and orders</span></span
                        ></a
                    ><a class="role" href="pin.html?role=kitchen" style="background: #fbefc0"
                        ><span
                            style="
                                width: 72px;
                                height: 72px;
                                border-radius: 24px;
                                background: rgba(255, 255, 255, 0.7);
                                display: grid;
                                place-items: center;
                            "
                            ><svg
                                width="36"
                                height="36"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path
                                    d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-6 1-9z"
                                /></svg></span
                        ><span
                            ><b style="font-size: 30px; font-weight: 600; display: block">Kitchen</b
                            ><span style="font-size: 16px">Tickets and timers</span></span
                        ></a
                    ><a class="role" href="pin.html?role=cashier" style="background: #fbdccf"
                        ><span
                            style="
                                width: 72px;
                                height: 72px;
                                border-radius: 24px;
                                background: rgba(255, 255, 255, 0.7);
                                display: grid;
                                place-items: center;
                            "
                            ><svg
                                width="36"
                                height="36"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <circle cx="12" cy="12" r="8" />
                                <path
                                    d="M12 7v10M9.5 10c0-2 5-2 5 0s-5 2-5 4 5 2 5 0"
                                /></svg></span
                        ><span
                            ><b style="font-size: 30px; font-weight: 600; display: block">Cashier</b
                            ><span style="font-size: 16px">Bills and payments</span></span
                        ></a
                    ><a class="role" href="pin.html?role=owner" style="background: #1b1d1f; color: #fff"
                        ><span
                            style="
                                width: 72px;
                                height: 72px;
                                border-radius: 24px;
                                background: rgba(255, 255, 255, 0.16);
                                display: grid;
                                place-items: center;
                            "
                            ><svg
                                width="36"
                                height="36"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg></span
                        ><span
                            ><b style="font-size: 30px; font-weight: 600; display: block">Owner</b
                            ><span style="font-size: 16px">Menu, stock and reports</span></span
                        ></a
                    >
                </div>
            </div>
        </div>
    </body>
</html>
