<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lanay PIN</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
        />
        <link rel="stylesheet" href="../assets/staff.css" />
    </head>
    <body>
        <div class="pg" style="min-height: 860px">
            <div class="bgart" aria-hidden="true">
                <span class="b2"></span><span class="b3"></span><span class="ring"></span
                ><span class="wave"></span
                ><img class="wm" src="../../assets/images/logo.png" alt="" aria-hidden="true" />
            </div>
            <div class="wr">
                <div style="max-width: 420px; margin: 30px auto 0; text-align: center">
                    <img
                        class="lg"
                        src="../../assets/images/logo.png"
                        alt="Lanay Restaurant"
                        style="width: 120px; height: 120px; margin: 0 auto 10px; display: block"
                    />
                    <p class="script" id="role-greeting" style="font-size: 56px; margin: 0">Hello, Cashier</p>
                    <p style="margin: 6px 0 24px; color: #5b5f63">Enter your 4-digit PIN.</p>
                    <div class="r" id="dots" style="justify-content: center; gap: 16px; margin-bottom: 26px">
                        <span class="dot-indicator"
                            style="
                                width: 22px;
                                height: 22px;
                                border-radius: 50%;
                                background: #fff;
                                box-shadow: inset 0 0 0 2px #1b1d1f;
                            "
                        ></span
                        ><span class="dot-indicator"
                            style="
                                width: 22px;
                                height: 22px;
                                border-radius: 50%;
                                background: #fff;
                                box-shadow: inset 0 0 0 2px #1b1d1f;
                            "
                        ></span
                        ><span class="dot-indicator"
                            style="
                                width: 22px;
                                height: 22px;
                                border-radius: 50%;
                                background: #fff;
                                box-shadow: inset 0 0 0 2px #1b1d1f;
                            "
                        ></span
                        ><span class="dot-indicator"
                            style="
                                width: 22px;
                                height: 22px;
                                border-radius: 50%;
                                background: #fff;
                                box-shadow: inset 0 0 0 2px #1b1d1f;
                            "
                        ></span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px">
                        <button type="button" class="k" onclick="press('1')">1</button><button type="button" class="k" onclick="press('2')">2</button
                        ><button type="button" class="k" onclick="press('3')">3</button><button type="button" class="k" onclick="press('4')">4</button
                        ><button type="button" class="k" onclick="press('5')">5</button><button type="button" class="k" onclick="press('6')">6</button
                        ><button type="button" class="k" onclick="press('7')">7</button><button type="button" class="k" onclick="press('8')">8</button
                        ><button type="button" class="k" onclick="press('9')">9</button><button type="button" class="k"></button
                        ><button type="button" class="k" onclick="press('0')">0</button><button type="button" class="k" onclick="press('Del')">Del</button>
                    </div>
                    <a
                        class="btn sec"
                        href="roles.html"
                        style="margin-top: 20px; text-decoration: none"
                        >Not you? Back to roles</a
                    >
                </div>
            </div>
        </div>

        <script>
            var roleRoutes = {
                waiter: { name: "Waiter", action: "../waiter/tables.html" },
                kitchen: { name: "Kitchen", action: "../kitchen/tickets.html" },
                cashier: { name: "Cashier", action: "../cashier/orders.html" },
                owner: { name: "Owner", action: "../owner/reports.html" }
            };

            var params = new URLSearchParams(window.location.search);
            var roleKey = (params.get("role") || "cashier").toLowerCase();
            var activeRole = roleRoutes[roleKey] || roleRoutes["cashier"];

            var greetingEl = document.getElementById("role-greeting");
            if (greetingEl) {
                greetingEl.textContent = "Hello, " + activeRole.name;
            }
            document.title = "Lanay PIN - " + activeRole.name;

            var pin = "";

            function showDots() {
                var dots = document.querySelectorAll(".dot-indicator");
                for (var i = 0; i < dots.length; i++) {
                    dots[i].style.background = i < pin.length ? "#1b1d1f" : "#fff";
                }
            }

            function press(key) {
                if (key === "Del") {
                    pin = pin.slice(0, -1);
                } else if (pin.length < 4 && /^[0-9]$/.test(key)) {
                    pin = pin + key;
                }
                showDots();
                if (pin.length === 4) {
                    window.location.href = activeRole.action;
                }
            }

            document.addEventListener("keydown", function (event) {
                if (/^[0-9]$/.test(event.key)) {
                    press(event.key);
                } else if (event.key === "Backspace") {
                    press("Del");
                }
            });
        </script>
    </body>
</html>
